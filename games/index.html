<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игры — Ламопад</title>
  <meta name="description" content="Мини-игры Ламопада — самосвал сквозь ретро-космос и выгорание в офисе.">
  <meta name="author" content="Ламопад">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://lamopad.ru/games/">
  <link rel="icon" href="/img/slon_32px.jpg" type="image/jpeg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Игры — Ламопад">
  <meta property="og:description" content="Мини-игры Ламопада — самосвал сквозь ретро-космос и выгорание в офисе.">
  <meta property="og:url" content="https://lamopad.ru/games/">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Ламопад">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap');

    :root {
      --bg:     #f5f4f0;
      --text:   #1a1a1a;
      --accent: #8B0000;
      --muted:  #888880;
      --col:    62ch;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 18px; background: var(--bg); color: var(--text); }

    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-weight: 400;
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.25rem;
      cursor: url('/img/lamopad_cursor_48px.png'), auto;
    }

    /* ── BREADCRUMBS ── */
    .breadcrumbs {
      width: 100%;
      max-width: var(--col);
      margin-top: 2.5rem;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .breadcrumbs a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumbs a:hover { color: var(--accent); }
    .breadcrumbs .sep { margin: 0 0.6ch; opacity: 0.4; }

    /* ── HEADER ── */
    .header {
      width: 100%;
      max-width: var(--col);
      margin-top: 3.5rem;
      margin-bottom: 3.5rem;
    }

    .title {
      font-size: clamp(1.4rem, 5vw, 1.85rem);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-top: 0.6rem;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── GAME LIST ── */
    .game-list {
      width: 100%;
      max-width: var(--col);
      list-style: none;
    }

    .game-list li {
      border-top: 1px solid var(--muted);
      padding: 1.75rem 0;
    }

    .game-list li:last-child { border-bottom: 1px solid var(--muted); }

    .game-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .game-title {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
      transition: color 0.2s;
      margin-bottom: 0.4rem;
    }

    .game-link:hover .game-title { color: var(--accent); }

    .game-desc {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 300;
    }

    .game-arrow {
      display: inline-block;
      margin-left: 0.5ch;
      font-size: 0.8em;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }

    .game-link:hover .game-arrow { opacity: 1; transform: translateX(0); }

    /* ── TRACKS LINK ── */
    .tracks-wrap {
      width: 100%;
      max-width: var(--col);
      margin-top: 4rem;
    }

    .tracks-link {
      display: block;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--accent);
      transition: background 0.2s, color 0.2s;
      opacity: 0.85;
    }

    .tracks-link:hover { background: var(--accent); color: var(--bg); opacity: 1; }

    /* ── FOOTER ── */
    footer {
      width: 100%;
      max-width: var(--col);
      margin-top: 3rem;
      margin-bottom: 2rem;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      opacity: 0.35;
      text-align: center;
    }

    @media (min-width: 700px) {
      body { padding: 0 2rem; }
      .breadcrumbs { margin-top: 3.5rem; }
      .tracks-link { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <nav class="breadcrumbs" aria-label="Навигация">
    <a href="/">Ламопад</a>
    <span class="sep">/</span>
    <span>Игры</span>
  </nav>

  <div class="header">
    <h1 class="title">Игры</h1>
    <p class="subtitle">мини-игры в браузере &nbsp;·&nbsp; Ламопад</p>
  </div>

  <ul class="game-list">

    <li>
      <a class="game-link" href="/samosval/game/">
        <div class="game-title">Самосвал<span class="game-arrow">→</span></div>
        <div class="game-desc">Управляй ламой-самосвалом сквозь ретро-космос — уворачивайся от ящиков, собирай пилюли.</div>
      </a>
    </li>

    <li>
      <a class="game-link" href="/agu/game/">
        <div class="game-title">АГУ<span class="game-arrow">→</span></div>
        <div class="game-desc">Игра про выгорание. Офис, дедлайны, экзистенциальный кризис.</div>
      </a>
    </li>

  </ul>

  <div class="tracks-wrap">
    <a class="tracks-link" href="/tracks/">Треки Ламопад →</a>
  </div>

  <footer>&copy; Ламопад &mdash; все права защищены</footer>

</body>
</html>

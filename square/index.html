<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>▼▪◇▲◆: ◄◄▲▫-□■█□ ▫◇█■●◆◄</title>
  <meta name="description" content="◆▫▫◆-▫◄◄▫, ◆►● ▫●□▫▫ ▫◆◇■▫▲▫▫◆◇ ◄█○▲◇.">
  <meta name="keywords" content="◆●◇□◆◄▫, ▲▫○◇●, ◇◇▫◆-█▫◇◄, ▲◆◄█▼◇○●○◆ ●▼▪□, ►►◇■◆">
  <meta property="og:title" content="▼▪◇▲◆ | □◆◇◇■▫◆">
  <meta property="og:description" content="◆▫▫◆-▫◄◄▫, ◆►● ▫●□▫▫ ▫◆◇■▫▲▫▫◆◇ ◄█○▲◇.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://lamopad.ru/shmurdiki/img/shmurdiki600px.png">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="600">
  <meta property="og:url" content="https://lamopad.ru/square/">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="◆●◇□◆◄▫">
  <link rel="canonical" href="https://lamopad.ru/square/">
  <link rel="icon" href="/shmurdiki/img/shmurdiki64px.png" type="image/png" sizes="64x64">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script data-goatcounter="https://lamopad.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<!-- Доска: четыре панели играются одновременно, клавиатура у них общая.
     Кто есть кто и как устроен — в шапке js/board.js -->
<div id="board">
  <!-- square: толпа налегает на плиту у обрыва. Phaser, js/scenes + js/objects -->
  <section class="pane" id="pane-square"><div id="game"></div><span class="pane-tag">▲▫◇</span></section>
  <!-- sisyphus: лама катит яблоко в гору. js/games/sisyphus.js -->
  <section class="pane" id="pane-hill"><span class="pane-tag">◄█○</span></section>
  <!-- swing: качели между солнцем и грозой. js/games/swing.js -->
  <section class="pane" id="pane-swing"><span class="pane-tag">▪◆▫</span></section>
  <!-- typewriter: машинка, печатающая блоки. js/games/typewriter.js -->
  <section class="pane" id="pane-writer"><span class="pane-tag">□■●</span></section>
</div>

<audio id="track" src="../tracks/shmurdiki.mp3" loop preload="none"></audio>

<div id="audio-controls">
  <button id="mute-music" class="mute-btn" type="button" aria-label="▫◄◇▫○◄">🎵</button>
  <button id="mute-sfx" class="mute-btn" type="button" aria-label="◇█▫►◆">🔊</button>
</div>

<!-- загрузка -->
<div id="loading">
  <div class="load-title">▼▪◇▲◆</div>
  <svg class="load-fig" viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="0" y="0" width="18" height="18" fill="#0a0a0c"/>
    <path d="M4 0 L5 5 L3 9 L6 14 L5 18" stroke="#1e1e24" stroke-width="0.5" fill="none"/>
    <path d="M12 0 L11 6 L14 11 L12 18" stroke="#1e1e24" stroke-width="0.5" fill="none"/>
    <path d="M0 11 L6 12 L11 10 L18 12" stroke="#16161a" stroke-width="0.5" fill="none"/>
  </svg>
  <div class="load-dots"><span>■</span><span>■</span><span>■</span></div>
  <a class="load-studio" href="../">◇●◇□◆◄▫</a>
  <div class="load-copy">НЕКОТОРЫЕ ЛЕВЫ НЕБЕЗОПАСНЫ</div>
</div>

<!-- старт -->
<div id="start">
  <div class="s-cloud c1"></div>
  <div class="s-cloud c2"></div>
  <div class="s-cloud c3"></div>
  <a class="load-studio" href="../">◇●◇□◆◄▫</a>
  <div class="load-copy">НЕКОТОРЫЕ ЛЕВЫ НЕБЕЗОПАСНЫ</div>
  <div class="start-inner">
    <div class="start-title">▼▪◇▲◆</div>
    <svg class="start-fig" viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="0" width="18" height="18" fill="#0a0a0c"/>
      <path d="M4 0 L5 5 L3 9 L6 14 L5 18" stroke="#1e1e24" stroke-width="0.5" fill="none"/>
      <path d="M12 0 L11 6 L14 11 L12 18" stroke="#1e1e24" stroke-width="0.5" fill="none"/>
      <path d="M0 11 L6 12 L11 10 L18 12" stroke="#16161a" stroke-width="0.5" fill="none"/>
    </svg>
    <div class="start-toggles">
      <button id="opt-music" class="tgl" type="button">🎵 ▫◄◇▫○◄</button>
      <button id="opt-sfx" class="tgl" type="button">🔔 ◇█▫►◆</button>
      <button id="opt-fs" class="tgl" type="button">⛶ □◄▪□ ▫◇◄▫▲</button>
      <button id="opt-disco" class="tgl" type="button">🌀 ◇▫▪◆►▪◄</button>
    </div>
    <p class="start-warn">□ ●►▲○ ●■◆◇ ○■●▪█◆, ►▫◇◇◆ ▲ ○▪▫◆◆◄◆█ ◇▲◄▫</p>
    <button id="start-btn" type="button" class="start-go">◇▫▲◆◆ ▪◆◆□█■●</button>
    <div class="start-links">
      <button id="start-share" type="button" class="start-more">🔗 ○▫◄◆◇▫▪●■●</button>
      <a class="start-more" href="../games/">🎮 ○●▫►◆○ ▫■◆◆</a>
    </div>
  </div>
</div>

<script src="../lib/phaser.min.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>

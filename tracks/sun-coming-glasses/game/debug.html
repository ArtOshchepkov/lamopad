<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Солнценаступление — игра по треку «Солнценаступательные очки» | Ламопад</title>
  <meta name="description" content="Солнценаступление — браузерная мини-игра по треку Ламопада «Солнценаступательные очки»: прыгай очками по облакам от офисной рутины к солнцу. Дудл-джампер с ламами, рюкзаками и Камю.">
  <meta name="keywords" content="Ламопад, Солнценаступательные очки, мини-игра, браузерная игра, дудл джамп, инди-рок, ламы">
  <meta property="og:title" content="Солнценаступление — игра | Ламопад">
  <meta property="og:description" content="Прыгай очками по облакам от рутины к солнцу. Там хорошо!">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://lamopad.ru/tracks/sun-coming-glasses-cover.jpg">
  <meta property="og:url" content="https://lamopad.ru/tracks/sun-coming-glasses/game/">
  <meta property="og:locale" content="ru_RU">
  <link rel="canonical" href="https://lamopad.ru/tracks/sun-coming-glasses/game/">
  <link rel="icon" href="../../sun-coming-glasses-cover.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="game"></div>

<audio id="track" src="../../sun-coming-glasses.mp3" loop preload="none"></audio>

<button id="mute" type="button" aria-label="Выключить музыку">🔊</button>

<!-- загрузочный экран -->
<div id="loading">
  <div class="load-title"><span class="g">Солнце</span>наступление</div>
  <div class="load-glasses">🕶</div>
  <div class="load-dots"><span>■</span><span>■</span><span>■</span></div>
</div>

<!-- экран падения -->
<div id="death" class="hidden">
  <div class="death-box">
    <p class="death-quote">Раскисать и откисать —<br>это разные вещи.</p>
    <div class="death-stats">
      <div id="death-height" class="death-height">0 м</div>
      <div id="death-best" class="death-best">рекорд · 0 м</div>
      <div id="death-new" class="death-new hidden">★ НОВЫЙ РЕКОРД! ★</div>
    </div>
    <button id="restart" type="button" class="death-btn">Откиснуть и погнали</button>
    <a class="death-link" href="../">← к треку «Солнценаступательные очки»</a>
  </div>
</div>

<script src="../../../lib/phaser.min.js"></script>
<script type="module" src="js/main.js"></script>

<script>
window.addEventListener('load', function () {
  var lifting = true;
  setTimeout(function () {
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', keyCode: 38, bubbles: true }));
    // автолифт: тянем игрока вверх, имитируя идеальные прыжки
    var iv = setInterval(function () {
      try {
        var gs = window.__scg.scene.getScene('game');
        if (!lifting) return;
        gs.player.sprite.y -= 260;
        gs.player.vy = -300;
      } catch (e) { console.log('DBG err ' + e.message); }
    }, 100);
    setTimeout(function () { lifting = false; }, 16000); // потом честно падаем
  }, 2600);
  setInterval(function () {
    try {
      var gs = window.__scg.scene.getScene('game');
      var dead = !document.getElementById('death').classList.contains('hidden');
      console.log('DBG m=' + gs.maxM + ' state=' + gs.state + ' dead=' + dead);
    } catch (e) { console.log('DBG scene err'); }
  }, 1000);
});
</script></body>
</html>
